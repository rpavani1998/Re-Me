services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reme
      POSTGRES_PASSWORD: reme
      POSTGRES_DB: reme
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["reme-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reme"]
      interval: 5s
      retries: 10
volumes:
  reme-data:
